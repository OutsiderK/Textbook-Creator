# Knowledge Points Ledger
#
# Single source of truth for all extracted KPs across all PPT ingests.
# See references/ingest.md for the full schema and ingestion rules.
#
# Each KP follows this shape:
#
#   - id: <SOURCE-CH##-SLUG>
#     concept: 简短中文描述
#     source:
#       - ppt: <filename>
#         slides: [n, n+1, ...]
#     core: true | false             # foundational/mechanism → true; example/exam-only → false
#     role: foundation | mechanism | method | example | formula | pitfall | exam_pattern
#     detail_cards:
#       - type: method | example | operation | figure | exam_tip
#         summary: 一句话概括
#         source_slide: <n>
#     chapter_candidates: []          # filled by Stage A (best-effort); refined by Stage B
#     applied_to: null | chXX-slug
#     status: pool | queued | applied
#     reader_notice: none | needed | published
#     # When status=queued:
#     action: new_chapter | patch_chapter
#     # When status=pool and aged:
#     pool_reason: awaiting_followup | bridging_undefined | enrichment_only | manual_review
#     links:
#       prerequisites: []             # KP ids this builds on
#       extends: []                   # KP ids this generalizes
#       contrasts: []                 # KP ids this contrasts with
#     retrieval_hooks:
#       local: []                     # self-contained quiz prompts (fill at ingest)
#       bridging: []                  # cross-chapter migration prompts (fill at write/patch)
#
# Status transitions (monotonic, with one exception for action cleanup):
#
#   [ingest] →  pool
#   [rebalance] pool → queued + action=new_chapter   (reader_notice: none)
#                    → queued + action=patch_chapter (reader_notice: needed)
#   [write]   queued (new_chapter) → applied  (drop action field)
#   [patch]   queued (patch_chapter) → applied (drop action; reader_notice → published)
#
# Do NOT manually edit KPs to roll back status. If a stage is interrupted, use the
# in-progress recovery flow described in SKILL.md.

knowledge_points: []
