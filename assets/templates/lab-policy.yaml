# Lab Policy
#
# 控制本项目是否包含实验，以及实验风格的默认偏好。
# Init 阶段如果用户选择不要 lab 或不决定，会写一份 minimal 的；否则按用户回答完整填写。
# 详细规则见 references/lab-policy-and-design.md。

enabled: undecided          # true | false | undecided
decision_required_before: first_lab_candidate

# 仅当 enabled=true 时下面的 defaults 才生效。
defaults:
  required_or_optional: optional     # required | optional | teacher_only
  expected_minutes: 45               # 30 | 45 | 60 | 90
  needs_reference_solution: true
  needs_starter: true
  needs_verify_script: true
  target_env: linux                  # linux | wsl | docker | any

preferences:
  course_focus: mechanism_understanding   # mechanism_understanding | exam_drill | engineering_practice
  toolchain: []                          # 例如 ["xv6", "nemu", "python", "c-posix", "command-observe"]
  forbidden: []                          # 例如 ["root", "network"]

note: |
  在此记录用户对实验风格的偏好或需要避免的事项。
